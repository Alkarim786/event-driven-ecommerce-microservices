name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + Testcontainers integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # -Pit also runs the @Tag("integration") suite: all four services against real
      # Kafka (KRaft) and Postgres started by Testcontainers on the runner's Docker.
      - name: mvn verify -Pit
        run: mvn -B verify -Pit
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"

  docker:
    name: Build service images
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all four images with compose
        run: docker compose build
      - name: Smoke test the full stack
        run: |
          docker compose up -d
          for port in 8081 8082 8083 8084; do
            for i in $(seq 1 60); do
              curl -fs "http://localhost:$port/actuator/health" > /dev/null && break
              sleep 3
            done
            curl -fs "http://localhost:$port/actuator/health"; echo
          done
          ORDERS=200 CONCURRENCY=20 docker compose --profile bench run --rm -e ORDERS -e CONCURRENCY loadtest
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
